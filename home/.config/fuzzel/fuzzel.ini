# Compact, macOS-inspired dark glass launcher.
[main]
font=Noto Sans:size=13
dpi-aware=no
anchor=center
layer=overlay
keyboard-focus=exclusive
terminal=kitty -e
prompt="搜索: "
placeholder=应用名称…
icons-enabled=yes
width=42
lines=6
line-height=36
horizontal-pad=22
vertical-pad=18
inner-pad=12

# RGBA colors; BF alpha means approximately 75% background opacity.
[colors]
background=24242bbf
text=f5f5f7ff
prompt=f5f5f7ff
placeholder=a5a5b0ff
input=f5f5f7ff
match=b4befeff
selection=ffffff20
selection-text=f5f5f7ff
selection-match=b4befeff
border=ffffff30

[border]
width=1
radius=20

[general]
fullscreen = true
initial-tool = "arrow"
copy-command = "wl-copy --type image/png"
# Copy also saves the edited image, including copies made with Ctrl+C.
save-after-copy = true
output-filename = "~/Pictures/Screenshots/Screenshot-%Y-%m-%d_%H-%M-%S.png"
early-exit = []
actions-on-enter = ["save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
actions-on-right-click = []

[font]
family = "Sans"
fallback = ["Noto Sans CJK SC"]

[color-palette]
palette = ["#d0bcffff", "#ff728fff", "#ffda72ff", "#7fff9aff", "#ffffffff"]

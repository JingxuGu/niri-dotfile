# Font: adjust font_size here.
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Work with both GNOME Wayland and Ubuntu on Xorg (Jammy Kitty 0.21).
# X11 also provides Fcitx5 input in Kitty; native Wayland IME is limited.
linux_display_server x11
sync_to_monitor yes
repaint_delay 10
input_delay 3

# Window geometry (padding is in points).
hide_window_decorations no
window_padding_width 8

# GNOME does not provide background blur without a separate extension.
background_opacity 0.65

# True color and predictable editor rendering.
term xterm-kitty
env COLORTERM=truecolor
disable_ligatures cursor

# Static palette inherited from the original branch.
include colors.conf

# Use Zsh immediately, including in desktop sessions started before chsh.
shell /usr/bin/zsh -l
env SHELL=/usr/bin/zsh

# Font: adjust font_size here.
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Native Wayland and GPU rendering; keep stable frame/input defaults.
linux_display_server wayland
sync_to_monitor yes
repaint_delay 10
input_delay 3

# Window geometry (padding is in points).
hide_window_decorations yes
window_padding_width 8

# Transparent background; Niri owns the blur and rounded corners.
background_opacity 0.65
background_blur 0

# True color and predictable editor rendering.
term xterm-kitty
env COLORTERM=truecolor
disable_ligatures cursor
cursor_trail 0

# Existing DMS-generated colors; keep behavior/font settings in this file.
include dank-theme.conf

# Use Zsh immediately, including in desktop sessions started before chsh.
shell /usr/bin/zsh -l
env SHELL=/usr/bin/zsh
